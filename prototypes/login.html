<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login - MMU Facility Booking</title>
    <link rel="stylesheet" href="../public/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@300,0..1&display=swap" rel="stylesheet"/>
</head>
<body>

    <div class="auth-container">
        <!-- Left Side: Form -->
        <div class="auth-form-side">
            <div class="auth-form-wrapper">

                <div class="auth-header">
                    <h2>Welcome Back!</h2>
                    <p>Enter your MMU credentials to access the portal.</p>
                </div>

                <!-- DATABASE INTEGRATION -->
                <form id="loginForm" action="../PHP/login_process.php" method="POST">

                    <div class="form-group">
                        <label>MMU Email</label>
                        <input 
                            type="email" 
                            name="email" 
                            id="loginEmail"
                            class="form-control" 
                            placeholder="studentID@student.mmu.edu.my"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <label style="margin-bottom: 0;">Password</label>
                            <a href="forgot-password.php" style="font-size: 13px; color: var(--primary); font-weight: 500;">Forgot password?</a>
                        </div>

                        <input 
                            type="password" 
                            name="password" 
                            id="loginPassword"
                            class="form-control" 
                            placeholder="••••••••" 
                            style="margin-top: 8px;"
                            required
                            minlength="8"
                        >
                    </div>

                    <!-- DATABASE INTEGRATION: name="login_btn" -->
                    <button type="submit" name="login_btn" class="btn btn-primary btn-full">
                        Secure Login
                    </button>

                     <!-- Back to Home Link -->
                    <div style="margin-top: 24px; display: flex; justify-content: flex-start;">
                        <a href="index.php" class="back-link-custom" style="text-decoration: none; display: flex; align-items: center; gap: 4px; color: var(--text-muted); font-size: 14px;">
                            <span class="material-symbols-outlined" style="font-size: 18px;">arrow_back</span>
                            Back to Home
                        </a>
                    </div>
                </form>

                <div class="auth-footer">
                    First time logging in? <a href="activate.html">Activate Account</a>
                </div>
            </div>
        </div>

        <!-- Right Side: Image -->
        <div class="auth-image-side">
            <img src="../public/img/melakalibrary.jpg" alt="Campus">
            <div class="auth-image-text">
                <h3>Fair. Secure. Accessible.</h3>
                <p>The new quota-based booking engine ensures every student gets equal access to premium campus facilities.</p>
            </div>
        </div>
    </div>

</body>
</html>
